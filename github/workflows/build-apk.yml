
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project
        run: unzip BlackBarAndroid_Project_with_APK_Build.zip

      - name: Build APK
        run: gradle --no-daemon -p BlackBarAndroid :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlackBar-APK
          path: BlackBarAndroid/app/build/outputs/apk/debug/app-debug.apk
          
